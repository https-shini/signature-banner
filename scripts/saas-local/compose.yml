# Actual official Auth, Storage and PostgREST. All host ports bind only to loopback.
name: identify-saas-test
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
    ports: ['127.0.0.1:54322:5432']
    volumes:
      - saas-db:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 2s
      retries: 20
  mail:
    image: axllent/mailpit:v1.27.8
    ports: ['127.0.0.1:54324:8025']
  auth:
    image: supabase/gotrue:v2.196.0
    depends_on:
      db: { condition: service_healthy }
    ports: ['127.0.0.1:54326:9999']
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:54321
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${DB_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: http://127.0.0.1:3000
      GOTRUE_URI_ALLOW_LIST: http://127.0.0.1:3000,http://127.0.0.1:3000/auth/callback,http://127.0.0.1:3080,http://127.0.0.1:3080/auth/callback,http://127.0.0.1:3080/auth/callback?intent=recovery
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_MAILER_AUTOCONFIRM: 'true'
      GOTRUE_PASSWORD_MIN_LENGTH: 12
      GOTRUE_SMTP_HOST: mail
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_ADMIN_EMAIL: local@example.test
      GOTRUE_SMTP_SENDER_NAME: Identify local
      GOTRUE_SMTP_MAX_FREQUENCY: 1s
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 1000
      GOTRUE_RATE_LIMIT_SIGN_IN_SIGN_UPS: 1000
      GOTRUE_RATE_LIMIT_HEADER: X-Forwarded-For
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
  rest:
    image: postgrest/postgrest:v14.17
    depends_on:
      db: { condition: service_healthy }
    ports: ['127.0.0.1:54327:3000']
    environment:
      PGRST_DB_URI: postgres://authenticator:${DB_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,identity_studio,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
  storage:
    image: supabase/storage-api:v1.74.0
    depends_on:
      db: { condition: service_healthy }
    ports: ['127.0.0.1:54328:5000']
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${DB_PASSWORD}@db:5432/postgres
      POSTGREST_URL: http://rest:3000
      STORAGE_PUBLIC_URL: http://127.0.0.1:54321
      FILE_SIZE_LIMIT: 5242880
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: local
      REGION: local
      GLOBAL_S3_BUCKET: local
      ENABLE_IMAGE_TRANSFORMATION: 'false'
    volumes: ['saas-images:/var/lib/storage']
volumes:
  saas-db:
  saas-images:
